name: Three Times Daily Maintenance

on:
  schedule:
    # 08:30, 14:30, and 20:30 Asia/Kolkata (UTC+05:30).
    - cron: '30 3,9,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record-maintenance-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Append an auditable maintenance record
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          mkdir -p maintenance
          timestamp_utc="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          timestamp_ist="$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')"

          if [ ! -f maintenance/activity-log.md ]; then
            cat > maintenance/activity-log.md <<'EOF'
# Automated Maintenance Activity

This file records successful maintenance workflow executions. Each entry is generated by GitHub Actions and includes the workflow context needed for auditability.

| Run | UTC | Asia/Kolkata | Event | Repository | Commit | Actor |
|---:|---|---|---|---|---|---|
EOF
          fi

          printf '| %s | %s | %s | %s | `%s` | `%s` | `%s` |\n' \
            "$RUN_NUMBER (id: $RUN_ID)" "$timestamp_utc" "$timestamp_ist" \
            "$EVENT_NAME" "$REPOSITORY" "${SHA:0:12}" "$ACTOR" \
            >> maintenance/activity-log.md

      - name: Commit maintenance record if it changed
        run: |
          if git diff --quiet -- maintenance/activity-log.md; then
            echo "No maintenance-log change detected; nothing to commit."
            exit 0
          fi

          git add maintenance/activity-log.md
          git commit -m "chore: record scheduled maintenance run"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
