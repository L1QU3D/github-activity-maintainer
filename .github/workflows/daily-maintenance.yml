name: Daily Activity Maintenance

on:
  schedule:
    # Runs 3 times a day (03:30, 09:30, 15:30 UTC)
    - cron: '30 3,9,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record-maintenance-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "L1QU3D"
          git config user.email "elduceentertainments@gmail.com"

      - name: Append activity log
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          mkdir -p maintenance
          timestamp_utc="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          timestamp_local="$(TZ='Asia/Dubai' date '+%Y-%m-%d %H:%M:%S')"

          if [ ! -f maintenance/activity-log.md ]; then
            printf "# Automated Activity Log\n\nThis file tracks daily maintenance runs.\n\n| Run | UTC | Local | Event | Repository | Commit | Actor |\n|---:|---|---|---|---|---|---|\n" > maintenance/activity-log.md
          fi

          printf '| %s | %s | %s | %s | `%s` | `%s` | `%s` |\n' \
            "$RUN_NUMBER (id: $RUN_ID)" "$timestamp_utc" "$timestamp_local" \
            "$EVENT_NAME" "$REPOSITORY" "${SHA:0:12}" "$ACTOR" \
            >> maintenance/activity-log.md

      - name: Commit and push changes
        run: |
          if git diff --quiet -- maintenance/activity-log.md; then
            echo "No changes to commit."
            exit 0
          fi

          git add maintenance/activity-log.md
          git commit -m "chore(activity): record maintenance run [skip ci]"
          git push origin main
