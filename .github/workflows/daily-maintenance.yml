name: Daily Activity Maintenance

on:
  schedule:
    - cron: '30 3,9,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record-maintenance-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append activity log and commit
        run: |
          git config user.name "L1QU3D"
          git config user.email "elduceentertainments@gmail.com"

          mkdir -p maintenance
          timestamp_utc="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          timestamp_local="$(TZ='Asia/Dubai' date '+%Y-%m-%d %H:%M:%S')"

          if [ ! -f maintenance/activity-log.md ]; then
            printf "# Automated Activity Log\n\nThis file tracks daily maintenance runs.\n\n| Run | UTC | Local | Event | Commit |\n|---:|---|---|---|---|\n" > maintenance/activity-log.md
          fi

          printf '| %s | %s | %s | %s | `%s` |\n' \
            "${{ github.run_number }} (id: ${{ github.run_id }})" "$timestamp_utc" "$timestamp_local" \
            "${{ github.event_name }}" "${{ github.sha }}" \
            >> maintenance/activity-log.md

          git add maintenance/activity-log.md
          git commit -m "chore(activity): update daily activity log [skip ci]"
          git push origin main
